name: verify-manual

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to verify
        required: true
        type: string
      reason:
        description: Why this CI run is justified
        required: true
        type: choice
        options:
          - final-pre-merge
          - cross-platform-regression
          - explicit-user-request

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: manual-verify-${{ inputs.pr_number }}-${{ inputs.reason }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate live PR candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCHED_REF: ${{ github.ref_name }}
          VERIFY_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_JSON="$pr_json" node --input-type=module -e
          "const pr=JSON.parse(process.env.PR_JSON);
          if(pr.state!=='open') throw new Error('PR is not open');
          if(pr.base?.ref!=='master') throw new Error('PR base is not master');
          if(pr.head?.ref!==process.env.DISPATCHED_REF) throw new Error('dispatched ref is not the PR head branch');
          if(process.env.VERIFY_REASON==='final-pre-merge' && pr.draft) throw new Error('final-pre-merge requires a Ready PR');
          if(!pr.head?.sha) throw new Error('PR head revision is unavailable');
          console.log('PASS live PR metadata: '+pr.number+' '+pr.head.ref+' '+pr.head.sha);"
          checked_head="$(git rev-parse HEAD)"
          expected_head="$(PR_JSON="$pr_json" node --input-type=module -e "console.log(JSON.parse(process.env.PR_JSON).head.sha)")"
          test "$checked_head" = "$expected_head"

      - name: Fetch current base branch
        shell: bash
        run: git fetch --no-tags origin master:refs/remotes/origin/master

      - name: Create temporary current-base integration
        shell: bash
        run: git merge --no-commit --no-ff origin/master

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
